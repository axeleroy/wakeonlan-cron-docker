name: Docker publish tagged version

on:
    workflow_dispatch:
    push:
        tags:
            - 'v[0-9].[0-9]+.[0-9]+'
        branches:
            - main
        paths:
            - Dockerfile
            - entrypoint.sh

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            -   name: Install jq
                run: sudo apt install jq -y
            -   name: Get tag
                id: get_tag
                run: |
                    TAG=$(curl https://api.github.com/repos/axeleroy/wakeonlan-cron-docker/releases/latest | jq -r '.tag_name')
                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
                with:
                    images: |
                        axeleroy/wakeonlan-cron-docker
                        ghcr.io/axeleroy/wakeonlan-cron-docker
                    tags: type=semver,pattern={{version}},value=${{ steps.get_tag.outputs.tag }}
            -   name: Login to DockerHub
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
            -   name: Login to GitHub Container Registry
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Build and push
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    push: true
                    platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/386,linux/ppc64le,linux/s390x
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
