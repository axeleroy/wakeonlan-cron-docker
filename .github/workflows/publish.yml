name: Docker publish tagged version

on:
    workflow_dispatch:
    push:
        tags:
            - 'v[0-9].[0-9]+.[0-9]+'
        branches:
            - main
        paths:
            - Dockerfile
            - entrypoint.sh

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            -   name: Install jq
                run: sudo apt install jq -y
            -   name: Get tag
                id: get_tag
                run: |
                    TAG=$(curl https://api.github.com/repos/axeleroy/wakeonlan-cron-docker/releases/latest | jq -r '.tag_name')
                    echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
                with:
                    images: |
                        axeleroy/wakeonlan-cron-docker
                        ghcr.io/axeleroy/wakeonlan-cron-docker
                    tags: type=semver,pattern={{version}},value=${{ steps.get_tag.outputs.tag }}
            -   name: Login to DockerHub
                uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
            -   name: Login to GitHub Container Registry
                uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Build and push
                uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
                with:
                    push: true
                    platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/386,linux/ppc64le,linux/s390x
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
